name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    # Pillar 1, enforced: selecta-core builds and tests on a runner with NO
    # webkit/GTK/Tauri system libraries installed. A Tauri import there fails here.
    name: Rust core (no UI toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p selecta-core --all-targets -- -D warnings
      - run: cargo test -p selecta-core --release
      - name: Protocol types are in sync with Rust
        run: git diff --exit-code -- packages/protocol/src/generated || (echo "::error::Run 'npm run protocol' and commit packages/protocol/src/generated" && exit 1)

  web:
    name: UI + engine (lint, types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @selecta/ui

  desktop:
    name: Desktop shell (Tauri)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # generate_context! embeds the built UI, so it must exist before clippy.
      - run: npm run build -w @selecta/ui
      - run: cargo clippy -p selecta-desktop --all-targets -- -D warnings
